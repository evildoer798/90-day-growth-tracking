name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.10-alpine3.22
        env:
          POSTGRES_DB: growth_tracking_ci
          POSTGRES_USER: growth_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U growth_ci -d growth_tracking_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: "true"
      DATABASE_URL: postgresql://growth_ci:ci-only-password@127.0.0.1:5432/growth_tracking_ci?schema=public
      AUTH_SECRET: ci-only-auth-secret-not-used-outside-actions
      AUTH_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.21.0"
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: pnpm db:generate
      - name: Validate Prisma schema
        run: pnpm prisma validate
      - name: Apply database migrations
        run: pnpm prisma migrate deploy
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and integration tests
        run: pnpm test
      - name: Production build
        run: pnpm build
