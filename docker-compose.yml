name: growth-tracking

services:
  db:
    image: postgres:16.10-alpine3.22
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-growth_tracking}
      POSTGRES_USER: ${POSTGRES_USER:-growth_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.docker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - internal

  migrate:
    build:
      context: .
      target: migrator
    command: ["node_modules/.bin/prisma", "migrate", "deploy", "--config", "prisma.config.ts"]
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-growth_app}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.docker}@db:5432/${POSTGRES_DB:-growth_tracking}?schema=public
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  ops:
    build:
      context: .
      target: ops
    profiles: ["ops"]
    restart: "no"
    command: ["pnpm", "--help"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-growth_app}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.docker}@db:5432/${POSTGRES_DB:-growth_tracking}?schema=public
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-growth_app}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.docker}@db:5432/${POSTGRES_DB:-growth_tracking}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env.docker}
      AUTH_URL: ${AUTH_URL:-http://127.0.0.1:3000}
      AUTH_TRUST_HOST: "true"
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal

volumes:
  postgres_data:

networks:
  internal:
